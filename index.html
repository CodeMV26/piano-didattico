<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pianificatore Didattico Fisica - Modena</title>
    <!-- Tesseract.js v5 per OCR Gratuito Client-Side -->
    <script src="https://unpkg.com/tesseract.js@v5.0.5/dist/tesseract.min.js"></script>
    <!-- SheetJS (xlsx) per Esportazione Excel Gratuita Client-Side -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --primary: #0056b3;
            --primary-hover: #004085;
            --text: #212529;
            --border: #dee2e6;
            --accent: #28a745;
            --accent-hover: #218838;
            --warning: #ffc107;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            line-height: 1.4;
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary);
        }

        h1 {
            font-size: 1.2rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .version-tag {
            font-size: 0.75rem;
            color: #6c757d;
            margin-top: 2px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .card h2 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            background-color: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .row {
            display: flex;
            gap: 8px;
        }

        .col {
            flex: 1;
        }

        button, .btn-file {
            display: inline-block;
            text-align: center;
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }

        button:active, .btn-file:active {
            background-color: var(--primary-hover);
        }

        .btn-ocr {
            background-color: #6f42c1;
            margin-bottom: 8px;
        }

        .btn-ocr:active {
            background-color: #593196;
        }

        .btn-excel {
            background-color: var(--accent);
            margin-bottom: 12px;
        }

        .btn-excel:active {
            background-color: var(--accent-hover);
        }

        input[type="file"] {
            display: none;
        }

        #ocrStatus {
            font-size: 0.8rem;
            color: #495057;
            background-color: #e9ecef;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: none;
            text-align: center;
        }

        .output-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.8rem;
        }

        .output-table th, .output-table td {
            border: 1px solid var(--border);
            padding: 6px 8px;
            text-align: left;
        }

        .output-table th {
            background-color: #e9ecef;
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            color: white;
        }

        .badge-spiegazione { background-color: #17a2b8; }
        .badge-esercitazione { background-color: #6c757d; }
        .badge-laboratorio { background-color: #ffc107; color: #000; }
        .badge-ripasso { background-color: #fd7e14; }
        .badge-verifica { background-color: #dc3545; }

        @media (max-width: 380px) {
            body { padding: 8px; }
            .card { padding: 10px; }
            .output-table { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Pianificatore Didattico</h1>
        <div class="version-tag">Versione Progetto: v0.2 | Export Excel | 0,00 € Free</div>
    </header>

    <div class="card">
        <h2>1. Dati Scuola e Calendario</h2>
        <div class="form-group">
            <label for="istituto">Nome Istituto</label>
            <input type="text" id="istituto" value="Liceo Scientifico 'A. Tassoni' - Modena">
        </div>
        <div class="row">
            <div class="col form-group">
                <label for="dataInizio">Inizio Lezioni</label>
                <input type="date" id="dataInizio" value="2026-09-15">
            </div>
            <div class="col form-group">
                <label for="dataFine">Fine Lezioni</label>
                <input type="date" id="dataFine" value="2027-06-05">
            </div>
        </div>
        <div class="form-group">
            <label for="materia">Materia di Insegnamento</label>
            <input type="text" id="materia" value="Fisica (1° Anno - 2 ore/sett)">
        </div>
    </div>

    <div class="card">
        <h2>2. Libro di Testo e Indice</h2>
        <div class="form-group">
            <label for="libro">Titolo Libro di Testo</label>
            <input type="text" id="libro" value="L'Amaldi per i licei scientifici">
        </div>

        <div class="form-group">
            <label>Scansione Indice da Foto (Fotocamera / Galleria)</label>
            <label for="fileOcr" class="btn-file btn-ocr">📸 Scansiona Foto Indice (OCR)</label>
            <input type="file" id="fileOcr" accept="image/*" onchange="eseguiOcrFoto(this)">
            <div id="ocrStatus">In attesa di immagine...</div>
        </div>

        <div class="form-group">
            <label for="indice">Indice Capitoli Estratto o Inserito (un capitolo per riga)</label>
            <textarea id="indice">Cap 1. Le grandezze fisiche e la misura
Cap 2. La rappresentazione dei dati e gli errori
Cap 3. I vettori e le forze
Cap 4. L'equilibrio dei solidi e la statica
Cap 5. La statica dei fluidi</textarea>
        </div>
    </div>

    <button onclick="generaPianoDidattico()">Genera Piano Didattico Completo</button>

    <div class="card" id="risultatoCard" style="display:none; margin-top:14px;">
        <h2>3. Piano Lezioni Generato</h2>
        <div id="statistiche"></div>
        <button class="btn-excel" onclick="esportaExcel()">📊 Esporta in Excel (.xlsx)</button>
        <div style="overflow-x:auto;">
            <table class="output-table" id="tabellaPiano">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Ora</th>
                        <th>Attività</th>
                        <th>Argomento</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        // Festività ufficiali Emilia-Romagna / Modena (A.S. 2026/2027)
        const festivitaER = [
            '2026-11-02', '2026-12-08',
            '2026-12-24', '2026-12-25', '2026-12-26', '2026-12-27', '2026-12-28', '2026-12-29', '2026-12-30', '2026-12-31',
            '2027-01-01', '2027-01-02', '2027-01-03', '2027-01-04', '2027-01-05', '2027-01-06',
            '2027-01-31',
            '2027-03-25', '2027-03-26', '2027-03-27', '2027-03-28', '2027-03-29', '2027-03-30',
            '2027-04-25', '2027-05-01', '2027-06-02'
        ];

        // Struttura globale per contenere i dati da esportare
        let datiPianoGenerato = [];

        // Funzione OCR con Tesseract.js in locale
        async function eseguiOcrFoto(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;

            const statusDiv = document.getElementById('ocrStatus');
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = '⏳ Caricamento motore OCR...';

            try {
                const worker = await Tesseract.createWorker('ita');
                statusDiv.innerHTML = '🔍 Analisi visiva della foto in corso...';

                const ret = await worker.recognize(file);
                await worker.terminate();

                // Pulizia testo riconosciuto
                const testoPulito = ret.data.text
                    .split('\n')
                    .map(linea => linea.trim())
                    .filter(linea => linea.length > 3)
                    .join('\n');

                if (testoPulito) {
                    document.getElementById('indice').value = testoPulito;
                    statusDiv.innerHTML = '✅ Indice estratto con successo!';
                } else {
                    statusDiv.innerHTML = '⚠️ Nessun testo rilevato chiaramente. Riprova con una foto più nitida.';
                }
            } catch (err) {
                console.error(err);
                statusDiv.innerHTML = '❌ Errore durante la scansione OCR.';
            }
        }

        function generaPianoDidattico() {
            const dataInizio = new Date(document.getElementById('dataInizio').value);
            const dataFine = new Date(document.getElementById('dataFine').value);
            const righeIndice = document.getElementById('indice').value.split('\n').filter(r => r.trim() !== '');

            if (righeIndice.length === 0) {
                alert('Inserisci o scansiona almeno un capitolo nell\'indice!');
                return;
            }

            // Calcolo giorni utili (Martedì e Giovedì)
            const dateLezione = [];
            let corrente = new Date(dataInizio);

            while (corrente <= dataFine) {
                const isoStr = corrente.toISOString().split('T')[0];
                const giorno = corrente.getDay(); // 2 = Martedì, 4 = Giovedì

                if ((giorno === 2 || giorno === 4) && !festivitaER.includes(isoStr)) {
                    dateLezione.push({
                        dataStr: corrente.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' }),
                        ora: giorno === 2 ? '1ª ora' : '2ª ora'
                    });
                }
                corrente.setDate(corrente.getDate() + 1);
            }

            const sequenzaTipi = [
                { nome: 'Spiegazione', classe: 'badge-spiegazione' },
                { nome: 'Esercitazione', classe: 'badge-esercitazione' },
                { nome: 'Laboratorio', classe: 'badge-laboratorio' },
                { nome: 'Ripasso', classe: 'badge-ripasso' },
                { nome: 'VERIFICA', classe: 'badge-verifica' }
            ];

            const tbody = document.querySelector('#tabellaPiano tbody');
            tbody.innerHTML = '';
            datiPianoGenerato = [];

            let capIndex = 0;
            let cicloStep = 0;

            dateLezione.forEach((slot, idx) => {
                const capAttuale = righeIndice[capIndex] || righeIndice[righeIndice.length - 1];
                const tipoObj = sequenzaTipi[cicloStep % sequenzaTipi.length];

                // Salva i dati per la tabella HTML
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${slot.dataStr}</td>
                    <td>${slot.ora}</td>
                    <td><span class="badge ${tipoObj.classe}">${tipoObj.nome}</span></td>
                    <td>${capAttuale}</td>
                `;
                tbody.appendChild(tr);

                // Salva i dati strutturati per l'esportazione Excel
                datiPianoGenerato.push({
                    "Data": slot.dataStr,
                    "Ora": slot.ora,
                    "Attività Didattica": tipoObj.nome,
                    "Argomento / Capitolo": capAttuale
                });

                cicloStep++;
                if (cicloStep % 5 === 0 && capIndex < righeIndice.length - 1) {
                    capIndex++;
                }
            });

            document.getElementById('statistiche').innerHTML = `<p style="font-size:0.85rem; margin-bottom:8px;"><strong>Ore totali calcolate:</strong> ${dateLezione.length} lezioni effettive.</p>`;
            document.getElementById('risultatoCard').style.display = 'block';
        }

        // Funzione di esportazione in formato Excel (.xlsx)
        function esportaExcel() {
            if (datiPianoGenerato.length === 0) {
                alert("Genera prima il piano didattico!");
                return;
            }

            const istituto = document.getElementById('istituto').value;
            const materia = document.getElementById('materia').value;

            // Creazione foglio Excel con SheetJS
            const wb = XLSX.utils.book_new();

            // Trasforma il JSON in foglio di lavoro
            const ws = XLSX.utils.json_to_sheet(datiPianoGenerato);

            // Aggiunge il foglio al libro Excel
            XLSX.utils.book_append_sheet(wb, ws, "Piano Lezioni");

            // Genera e scarica il file .xlsx
            XLSX.writeFile(wb, "Piano_Lezioni_Fisica_2026_2027.xlsx");
        }
    </script>
</body>
</html>
