<script>
        let immaginiCaricate = [];
        let pianoGenerato = [];

        function gestisciCaricamentoFoto(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    // Ridimensiona l'immagine per velocizzare drasticamente l'OCR
                    ridimensionaFoto(e.target.result, 1200, (imgOttimizzata) => {
                        immaginiCaricate.push(imgOttimizzata);
                        aggiornaGalleria();
                    });
                };
                reader.readAsDataURL(file);
            });
        }

        // Funzione per ottimizzare il peso delle foto scattate da iPhone/Mac
        function ridimensionaFoto(base64Str, maxWidth, callback) {
            let img = new Image();
            img.src = base64Str;
            img.onload = () => {
                let canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }

                canvas.width = width;
                canvas.height = height;
                let ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', 0.7)); // Compress a JPEG 70%
            };
        }

        function aggiornaGalleria() {
            const gallery = document.getElementById('gallery');
            const count = document.getElementById('fotoCount');
            const btnOCR = document.getElementById('btnOCR');
            
            gallery.innerHTML = '';
            count.innerText = `${immaginiCaricate.length} foto caricate`;
            
            immaginiCaricate.forEach((src, index) => {
                const div = document.createElement('div');
                div.className = 'relative group border rounded-lg overflow-hidden h-24 bg-slate-100';
                div.innerHTML = `
                    <img src="${src}" class="w-full h-full object-cover">
                    <button onclick="rimuoviFoto(${index})" class="absolute top-1 right-1 bg-red-600 text-white rounded-full p-1 text-xs shadow-md">✕</button>
                `;
                gallery.appendChild(div);
            });

            btnOCR.disabled = immaginiCaricate.length === 0;
        }

        function rimuoviFoto(index) {
            immaginiCaricate.splice(index, 1);
            aggiornaGalleria();
        }

        async function avviaOCRMultiplo() {
            if (immaginiCaricate.length === 0) return;
            
            const status = document.getElementById('ocrStatus');
            const argomentiInput = document.getElementById('argomentiInput');
            status.classList.remove('hidden');
            
            let testoComplessivo = '';

            for (let i = 0; i < immaginiCaricate.length; i++) {
                status.innerText = `Inizializzazione OCR pagina ${i + 1} di ${immaginiCaricate.length}...`;
                
                const worker = await Tesseract.createWorker('ita', 1, {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            const perc = Math.round(m.progress * 100);
                            status.innerText = `Pagina ${i + 1} di ${immaginiCaricate.length}: scansione in corso (${perc}%)`;
                        }
                    }
                });
                
                const ret = await worker.recognize(immaginiCaricate[i]);
                testoComplessivo += ret.data.text + '\n';
                await worker.terminate();
            }

            status.classList.add('hidden');
            argomentiInput.value = testoComplessivo.trim();
        }

        function generaPiano() {
            const materia = document.getElementById('materia').value;
            const libro = document.getElementById('titoloLibro').value;
            const argomentiRaw = document.getElementById('argomentiInput').value;
            
            const giorniSelezionati = [];
            for (let i = 1; i <= 6; i++) {
                if (document.getElementById(`giorno-${i}`).checked) {
                    giorniSelezionati.push(i);
                }
            }

            if (giorniSelezionati.length === 0) {
                alert("Seleziona almeno un giorno della settimana per le lezioni.");
                return;
            }

            let listaArgomenti = argomentiRaw.split(/[\n,]+/).map(a => a.trim()).filter(a => a.length > 0);
            if (listaArgomenti.length === 0) {
                listaArgomenti = [
                    "Introduzione alla materia e ripasso",
                    "Unità 1: Misura e grandezze fisiche",
                    "Unità 2: Il movimento e la cinematica",
                    "Unità 3: Le forze e la dinamica",
                    "Unità 4: Energia e lavoro",
                    "Verifica di recupero e consolidamento"
                ];
            }

            let dataCorrente = new Date(2026, 8, 15);
            const dataFine = new Date(2027, 5, 8);

            pianoGenerato = [];
            let numLezione = 1;
            let argIndex = 0;

            const giorniNomi = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];

            while (dataCorrente <= dataFine) {
                const dayOfWeek = dataCorrente.getDay();
                
                if (giorniSelezionati.includes(dayOfWeek)) {
                    const dataFormattata = dataCorrente.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    const nomeGiorno = giorniNomi[dayOfWeek];
                    
                    let argomento = listaArgomenti[argIndex % listaArgomenti.length];
                    let tipologia = (numLezione % 8 === 0) ? "Verifica Scritta" : ((numLezione % 4 === 0) ? "Esercitazione / Lab" : "Spiegazione");

                    pianoGenerato.push({
                        numero: numLezione,
                        data: dataFormattata,
                        giorno: nomeGiorno,
                        materia: materia,
                        libro: libro,
                        argomento: argomento,
                        tipologia: tipologia
                    });

                    numLezione++;
                    if (numLezione % 2 === 0) argIndex++;
                }
                
                dataCorrente.setDate(dataCorrente.getDate() + 1);
            }

            const corpo = document.getElementById('tabellaCorpo');
            corpo.innerHTML = '';
            pianoGenerato.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-medium text-slate-500">${row.numero}</td>
                    <td class="p-3 font-semibold text-slate-800">${row.data}</td>
                    <td class="p-3 text-slate-600">${row.giorno}</td>
                    <td class="p-3 text-slate-800">${row.argomento}</td>
                    <td class="p-3"><span class="px-2 py-1 text-xs rounded-full ${row.tipologia.includes('Verifica') ? 'bg-red-100 text-red-700 font-semibold' : 'bg-blue-100 text-blue-700'}">${row.tipologia}</span></td>
                `;
                corpo.appendChild(tr);
            });

            document.getElementById('risultatiSection').classList.remove('hidden');
            document.getElementById('btnExcel').classList.remove('hidden');
        }

        function esportaExcel() {
            if (pianoGenerato.length === 0) return;

            const datiExcel = pianoGenerato.map(item => ({
                "N° Lezione": item.numero,
                "Data": item.data,
                "Giorno": item.giorno,
                "Materia": item.materia,
                "Libro di Testo": item.libro,
                "Argomento / Unità Didattica": item.argomento,
                "Tipologia Lezione": item.tipologia
            }));

            const ws = XLSX.utils.json_to_sheet(datiExcel);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Piano Didattico");

            XLSX.writeFile(wb, `Piano_Didattico_${document.getElementById('materia').value}_2026_2027.xlsx`);
        }
    </script>
